name: Build macOS (universal)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # Commit gắn cờ [skip-mac] (ví dụ commit port Windows) chỉ build
    # Windows, tránh tạo thêm một release macOS trùng phiên bản.
    if: "!contains(github.event.head_commit.message, '[skip-mac]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (Apple Silicon + Intel)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Generate icon set from icons/icon.png
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build universal app (app bundle only, unsigned for now)
        # Tauri tự ký bằng APPLE_CERTIFICATE đã thử hai lần đều gãy ở bước
        # "failed to resolve signing identity": bộ phân giải danh tính của
        # Tauri không liệt kê được chứng chỉ tự ký (không nằm trong chuỗi
        # tin cậy của Apple). Vì vậy build app trước ở dạng chưa ký, rồi ký
        # thủ công bằng codesign ở bước sau — codesign chỉ cần khóa riêng
        # trong keychain, không cần chứng chỉ được Apple tin cậy.
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Sign app with the stable self-signed certificate
        # Chữ ký ổn định theo từng bản build (không như ký ad-hoc), nên
        # quyền Trợ năng/Tự động hoá người dùng đã cấp sẽ không bị mất khi
        # cập nhật bản mới. Lưu ý: tự ký KHÔNG thay chứng chỉ Apple nên
        # lần mở đầu vẫn cần chuột phải → Mở.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          # macOS dùng base64 -D (không phải --decode kiểu GNU).
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > /tmp/chd-cert.p12
          wc -c /tmp/chd-cert.p12
          # (Đã bỏ bước kiểm chứng bằng openssl: openssl trên runner không
          # nạp legacy provider nên không đọc được định dạng RC2-40 của
          # file p12 legacy — bước đó tự gãy dù file hoàn toàn đúng.
          # Bộ nạp của macOS (security import) đọc định dạng này bình thường.)
          security create-keychain -p temppass build.keychain
          security import /tmp/chd-cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temppass build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p temppass build.keychain
          security find-identity -v -p codesigning build.keychain
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/ChdMathType.app"
          codesign --force --deep --options runtime --timestamp=none --sign "ChdMathType Self-Signed" "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -i "Authority" | head -2
          rm -f /tmp/chd-cert.p12

      - name: Package signed app into dmg
        run: |
          set -e
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/ChdMathType.app"
          rm -rf /tmp/dmg-staging && mkdir -p /tmp/dmg-staging
          cp -R "$APP" /tmp/dmg-staging/
          ln -s /Applications /tmp/dmg-staging/Applications
          mkdir -p src-tauri/target/universal-apple-darwin/release/bundle/dmg
          hdiutil create -volname "ChdMathType" -srcfolder /tmp/dmg-staging -ov -format UDZO "src-tauri/target/universal-apple-darwin/release/bundle/dmg/ChdMathType_1.0.11_universal.dmg"
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/dmg/

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChdMathType-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish release with the dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v1.0.${{ github.run_number }}
          name: ChdMathType cho macOS — bản build ${{ github.run_number }}
          body: |
            Bản ChdMathType cho macOS (universal: chạy cả Apple Silicon và Intel).
            Tải file .dmg ở dưới, mở lên và kéo ChdMathType vào thư mục Applications.
            Lần mở đầu tiên: nhấp chuột phải vào app → Mở (vì app chưa có chứng chỉ Apple).
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
