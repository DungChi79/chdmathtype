name: Build Windows (x64)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Generate icon set from icons/icon.png
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Windows installer (NSIS, unsigned for now)
        # Chưa ký mã (giống bản macOS trước khi có chứng chỉ tự ký):
        # Windows sẽ hiện cảnh báo SmartScreen ở lần chạy đầu — bấm
        # More info → Run anyway. Không có bước ký vì chưa có chứng
        # chỉ ký mã cho Windows.
        run: npx tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChdMathType-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release with the installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v1.0.${{ github.run_number }}
          name: ChdMathType cho Windows — bản build ${{ github.run_number }}
          body: |
            Bản ChdMathType cho Windows (x64, Windows 10/11).
            Tải file .exe ở dưới và chạy để cài đặt.
            Lưu ý lần chạy đầu: Windows hiện cảnh báo SmartScreen vì app chưa có chứng chỉ ký mã — bấm More info → Run anyway.
            Máy cần có WebView2 (có sẵn trên hầu hết Windows 10/11) để app chạy.
            Tính năng như bản macOS: kích hoạt theo mã máy, đồng bộ ĐỀ THI, gửi thẳng vào Word (qua COM, không cần quyền đặc biệt).
          files: src-tauri/target/release/bundle/nsis/*.exe
